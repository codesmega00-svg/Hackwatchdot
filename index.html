<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0f" />
    <title>Suspected Binance exploiter: live sell tracker — HackWatch</title>
    <meta
      name="description"
      content="Live tracker of the suspected Binance hot wallet exploiter: every sale, what is still held, and how much of each stolen stack is already gone. Prices stream from Binance, the trail comes from public onchain data."
    />
    <link rel="icon" type="image/jpeg" href="/hackwatch-logo.jpg" />
    <link rel="apple-touch-icon" href="/hackwatch-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const init = localStorage.getItem("hackwatch.theme.dark_v2");
        if (!init) {
          localStorage.setItem("hackwatch.theme.dark_v2", "true");
          localStorage.setItem("hackwatch.theme", "dark");
        }
        const t = localStorage.getItem("hackwatch.theme");
        if (t === "light") {
          document.documentElement.setAttribute("data-theme", "light");
          document.body?.classList?.remove("dark-theme");
          document.body?.classList?.add("light-theme");
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
          document.body?.classList?.remove("light-theme");
          document.body?.classList?.add("dark-theme");
        }
      } catch (e) {}
    </script>
    <script
      defer
      data-website-id="dfid_YSjOotezq8LgCK0xdeebH"
      data-domain="hackwatch.hackwatch.workers.dev"
      src="https://datafa.st/js/script.js"
    ></script>
  </head>
  <body class="dark-theme">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
